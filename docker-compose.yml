version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: loft-postgres
    environment:
      POSTGRES_USER: loft_user
      POSTGRES_PASSWORD: loft_password
      POSTGRES_DB: the_loft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: loft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
